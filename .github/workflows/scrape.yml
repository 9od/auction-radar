name: 경매 데이터 자동 수집

on:
  push:
    branches: [main]
    paths:
      - scraper.py
      - auction_model.py
      - auction_config.json
      - .github/workflows/scrape.yml
  schedule:
    - cron: '0 22 * * *' # KST 07:00
  workflow_dispatch:

concurrency:
  group: auction-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 데이터 처리 검증
        run: python -m unittest discover -s tests -v
      - name: 과거 Git 기록 복원 (최초 1회)
        run: |
          if [ ! -f docs/auction_archive.json ]; then
            python scripts/restore_history.py
          fi
      - name: 법원별 앞 8페이지 수집 및 결과 확인
        id: collect
        continue-on-error: true
        run: python scraper.py --pages 8 --output docs/auction_data.json --archive docs/auction_archive.json
      - name: 누적 기록과 수집 상태 저장
        if: always()
        run: |
          git config user.name "auction-radar-bot"
          git config user.email "bot@auction-radar"
          git add docs/auction_data.json
          for file in docs/auction_archive.json docs/collection_status.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --staged --quiet; then
            git commit -m "경매 목록·결과 이력 갱신"
            git push
          fi
      - name: 현재 경매 목록 수집 실패 알림
        if: steps.collect.outcome == 'failure'
        run: |
          echo '현재 경매 목록 수집이 실패했습니다. 기존 기록은 유지됩니다. docs/collection_status.json을 확인하세요.'
          exit 1
